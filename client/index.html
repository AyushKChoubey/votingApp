<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="google-site-verification"
      content="5A4yu9P_vLn7iCUYvPk1_y5fvULFsdKmQ5HUlxM6Aks"
    />

    <!-- Primary Meta Tags -->
    <title>VoteBooth - Secure Online Voting Platform</title>
    <meta name="title" content="VoteBooth - Secure Online Voting Platform" />
    <meta
      name="description"
      content="Create and manage secure online voting booths in real-time. VoteBooth offers transparent, fair, and easy-to-use digital voting solutions for organizations, communities, and events."
    />
    <meta
      name="keywords"
      content="online voting, secure voting platform, digital voting, voting booth, real-time results, poll creation, secure elections, voting system"
    />
    <meta name="author" content="VoteBooth" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://voting-app-rose.vercel.app/" />
    <meta
      property="og:title"
      content="VoteBooth - Secure Online Voting Platform"
    />
    <meta
      property="og:description"
      content="Create and manage secure online voting booths in real-time. Transparent, fair, and easy-to-use digital voting solutions."
    />
    <meta
      property="og:image"
      content="https://voting-app-rose.vercel.app/og-image.jpg"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://voting-app-rose.vercel.app/"
    />
    <meta
      property="twitter:title"
      content="VoteBooth - Secure Online Voting Platform"
    />
    <meta
      property="twitter:description"
      content="Create and manage secure online voting booths in real-time. Transparent, fair, and easy-to-use digital voting solutions."
    />
    <meta
      property="twitter:image"
      content="https://voting-app-rose.vercel.app/og-image.jpg"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://voting-app-rose.vercel.app/" />
    <!-- Optional: alternate language versions (add hrefs if you add translations) -->
    <link
      rel="alternate"
      href="https://voting-app-rose.vercel.app/"
      hreflang="en-us"
    />

    <!-- Social / SEO extras -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="VoteBooth" />
    <meta name="twitter:site" content="@VoteBooth" />
    <meta name="twitter:creator" content="@VoteBooth" />

    <!-- App manifest / icons (optional but helpful for mobile and previews) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VoteBooth" />
    <meta name="msapplication-TileColor" content="#1e40af" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1e40af" />

    <!-- Google Fonts: Inter — loaded non-blocking to avoid render delay -->
    <!-- 1. Warm up the connection early (DNS + TLS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 2. Fetch the font CSS asynchronously (doesn't block render) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <!-- 3. Fallback for browsers with JavaScript disabled -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Structured data: Website + Organization (improves indexing & rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "url": "https://voting-app-rose.vercel.app/",
            "name": "VoteBooth",
            "description": "Create and manage secure online voting booths in real-time.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://voting-app-rose.vercel.app/?s={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "name": "VoteBooth",
            "url": "https://voting-app-rose.vercel.app/",
            "logo": "https://voting-app-rose.vercel.app/icon-192.png",
            "sameAs": []
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
